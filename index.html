<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Finanzas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --green: #4CAF50;
            --red: #F44336;
            --blue: #2196F3;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .col-left, .col-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        /* --- FORMULARIO --- */
        .form-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        
        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, select:focus { border-color: #888; }
        
        /* Para que el icono del calendario se vea blanco en modo oscuro */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-add:hover { background-color: #cccccc; }
        .btn-add:disabled { background-color: #555; cursor: not-allowed; }

        /* --- DASHBOARD --- */
        .dashboard {
            display: flex;
            gap: 10px;
        }

        .card {
            flex: 1;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card h3 { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-bottom: 5px; }
        .card p { font-size: 16px; font-weight: 600; }
        
        .card.balance p { color: var(--blue); }
        .card.income p { color: var(--green); }
        .card.expense p { color: var(--red); }

        /* --- GRÁFICO --- */
        .chart-container {
            display: none; 
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .chart {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--input-bg) 0% 100%);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }
        
        .chart::after {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            background-color: var(--card-bg);
            border-radius: 50%;
        }
        
        .chart-text {
            position: relative;
            z-index: 10;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        /* --- HISTORIAL --- */
        .history-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .history-item {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid transparent;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .history-item.income { border-left-color: var(--green); }
        .history-item.expense { border-left-color: var(--red); }

        .item-info { display: flex; flex-direction: column; gap: 4px; }
        
        .item-header { display: flex; align-items: center; gap: 8px; }
        .item-desc { font-size: 14px; font-weight: 600; }
        
        .item-details-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .item-category { 
            font-size: 10px; 
            background: #333; 
            padding: 2px 8px; 
            border-radius: 10px; 
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .item-date {
            font-size: 10px;
            color: #888;
        }

        .item-amount { font-size: 14px; font-weight: 600; }
        .history-item.income .item-amount { color: var(--green); }
        .history-item.expense .item-amount { color: var(--red); }

        .btn-delete {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .btn-delete:hover { color: var(--red); }

        /* --- RESPONSIVE --- */
        @media (min-width: 768px) {
            .layout { flex-direction: row; align-items: flex-start; }
            .col-left { flex: 1.2; }
            .col-right { flex: 1; }
            .chart-container { display: flex; }
            .dashboard { flex-direction: row; } 
            .card p { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="layout">
            
            <div class="col-left">
                <div class="form-container">
                    <form id="transaction-form">
                        <div class="form-group">
                            <label>Fecha</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label>Descripción (Ej: Pollo, Taxi, Sueldo)</label>
                            <input type="text" id="desc" placeholder="Detalle del movimiento..." required>
                        </div>
                        <div class="form-group">
                            <label>Monto</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Categoría</label>
                            <select id="category">
                                <option value="Comida">🍔 Comida / Mercado</option>
                                <option value="Transporte">🚕 Transporte / Pasajes</option>
                                <option value="Hogar">🏠 Casa / Servicios</option>
                                <option value="Cuidado Personal">🧴 Cuidado / Limpieza</option>
                                <option value="Ocio">🎉 Salidas / Ocio</option>
                                <option value="Educación">📚 Educación / Título</option>
                                <option value="Ingreso">💰 Ingreso / Sueldo</option>
                                <option value="Otros">📦 Otros</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tipo de movimiento</label>
                            <select id="type">
                                <option value="expense">Gasto (-)</option>
                                <option value="income">Ingreso (+)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-add" id="submit-btn">Agregar Movimiento</button>
                    </form>
                </div>

                <h2 class="history-title">Historial de Movimientos</h2>
                <ul class="history-list" id="history-list">
                    <li style="color: #888; font-size: 14px; text-align: center; padding: 20px;">Cargando datos...</li>
                </ul>
            </div>

            <div class="col-right">
                <div class="dashboard">
                    <div class="card balance">
                        <h3>Ahorro</h3>
                        <p id="balance">$0.00</p>
                    </div>
                    <div class="card income">
                        <h3>Ingreso</h3>
                        <p id="total-income">$0.00</p>
                    </div>
                    <div class="card expense">
                        <h3>Gasto</h3>
                        <p id="total-expense">$0.00</p>
                    </div>
                </div>

                <div class="chart-container">
                    <h3 style="font-size: 14px; color: #aaa;">Balance Visual</h3>
                    <div class="chart" id="chart">
                        <div class="chart-text" id="chart-text">Sin datos</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyCCGL0VN1LBEIIB6BYMtrUJKNeam04wz0aTyQlKhKA4p37EqnUgo9Vd5I5gP8giDLl/exec';

        let transactions = []; 

        const form = document.getElementById('transaction-form');
        const submitBtn = document.getElementById('submit-btn');
        const dateInput = document.getElementById('date');
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const categoryInput = document.getElementById('category');
        const typeInput = document.getElementById('type');
        const historyList = document.getElementById('history-list');
        
        const balanceEl = document.getElementById('balance');
        const incomeEl = document.getElementById('total-income');
        const expenseEl = document.getElementById('total-expense');
        const chartEl = document.getElementById('chart');
        const chartTextEl = document.getElementById('chart-text');

        // Poner la fecha de hoy por defecto en el input
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        };

        // Función para formatear la fecha que viene de Google Sheets
        const formatDate = (dateString) => {
            if (!dateString) return '';
            const d = new Date(dateString);
            // Si la fecha no es válida, devolvemos string vacío
            if (isNaN(d.getTime())) return ''; 
            // Formato DD/MM/YYYY
            return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        };

        async function fetchTransactions() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                transactions = data.transactions || [];
                updateUI();
            } catch (error) {
                console.error("Error al cargar datos:", error);
                historyList.innerHTML = '<li style="color: var(--red); font-size: 14px; text-align: center; padding: 20px;">Error al conectar con Google Sheets.</li>';
            }
        }

        function updateUI() {
            historyList.innerHTML = '';

            // ORDENAR POR FECHA (Más reciente primero)
            transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

            let totalIncome = 0;
            let totalExpense = 0;

            if (transactions.length === 0) {
                historyList.innerHTML = '<li style="color: #888; font-size: 14px; text-align: center; padding: 20px;">No hay movimientos registrados aún.</li>';
            }

            transactions.forEach((t, index) => {
                const amount = parseFloat(t.amount) || 0; 
                if (t.type === 'income') totalIncome += amount;
                else totalExpense += amount;

                const li = document.createElement('li');
                li.classList.add('history-item', t.type);
                
                const sign = t.type === 'income' ? '+' : '-';
                
                // Insertamos la fecha en el HTML
                li.innerHTML = `
                    <div class="item-info">
                        <div class="item-header">
                            <span class="item-desc">${t.desc}</span>
                        </div>
                        <div class="item-details-row">
                            <span class="item-category">${t.category}</span>
                            <span class="item-date">📅 ${formatDate(t.date)}</span>
                        </div>
                        <span class="item-amount">${sign} ${formatMoney(amount)}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteTransaction(${t.rowIndex})">✕</button>
                `;
                historyList.appendChild(li);
            });

            const totalBalance = totalIncome - totalExpense;
            balanceEl.innerText = formatMoney(totalBalance);
            incomeEl.innerText = formatMoney(totalIncome);
            expenseEl.innerText = formatMoney(totalExpense);

            const totalMovement = totalIncome + totalExpense;
            if (totalMovement > 0) {
                const incomePercent = (totalIncome / totalMovement) * 100;
                chartEl.style.background = `conic-gradient(var(--green) 0% ${incomePercent}%, var(--red) ${incomePercent}% 100%)`;
                
                const savingsPercent = totalIncome > 0 ? Math.round((totalBalance / totalIncome) * 100) : 0;
                if(totalBalance > 0) {
                     chartTextEl.innerHTML = `${savingsPercent}%<br>Ahorro`;
                } else {
                     chartTextEl.innerHTML = `${Math.round((totalExpense/totalIncome)*100)}%<br>Gasto`;
                }
            } else {
                chartEl.style.background = `conic-gradient(var(--input-bg) 0% 100%)`;
                chartTextEl.innerText = "Sin datos";
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const transaction = {
                date: dateInput.value, // <-- Enviamos la fecha
                desc: descInput.value,
                amount: parseFloat(amountInput.value),
                category: categoryInput.value,
                type: typeInput.value
            };

            submitBtn.innerText = "Guardando...";
            submitBtn.disabled = true;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'add', transaction: transaction })
                });
                
                form.reset();
                dateInput.value = today; // Restaurar la fecha de hoy
                descInput.focus();
                
                setTimeout(async () => {
                    await fetchTransactions();
                    submitBtn.innerText = "Agregar Movimiento";
                    submitBtn.disabled = false;
                }, 1000);

            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar. Revisa tu conexión.");
                submitBtn.innerText = "Agregar Movimiento";
                submitBtn.disabled = false;
            }
        });

        window.deleteTransaction = async (rowIndex) => {
            if (!confirm('¿Estás seguro de que quieres eliminar este movimiento?')) return;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
                });
                
                setTimeout(async () => {
                    await fetchTransactions();
                }, 1000);

            } catch (error) {
                console.error("Error al eliminar:", error);
                alert("Hubo un error al eliminar.");
            }
        };

        fetchTransactions();
    </script>
</body>
</html>
